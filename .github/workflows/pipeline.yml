name: PSX News Pipeline

# One job is always open ("the loop") and hands over to the next job every 100 minutes:
#   market hours (Mon-Fri 08:30-18:45 PKT)  a pass every minute -> news, results, filings within 1-2 minutes
#   evenings, nights, weekends              a pass every 10 minutes
# The loop also starts the swing scan and Stock of the Day workflows at their proper times.
# GitHub's own schedule starts jobs hours late, so it is only the backstop that restarts a broken chain.
# To stop everything: set fast_loop.enabled to false in config.yaml (or cancel the running job by hand).
on:
  schedule:
    - cron: "*/5 * * * *"   # backstop only: restarts the chain if a job ever fails to hand over
  workflow_dispatch:         # "Run workflow" button
    inputs:
      command:
        description: "What to do"
        type: choice
        default: auto
        options:
          - auto
          - loop --minutes 3
          - run
          - test --admin-only
          - test
          - brief morning
          - brief opening
          - brief midday
          - brief close
          - brief results
          - brief macro
          - brief brokers
          - brief week_ahead
          - about
          - chats

# Never run two at once (prevents double posting); a newer trigger waits for the current run.
concurrency:
  group: psx-pipeline
  cancel-in-progress: false

permissions:
  contents: write   # keeps the backup copy of the state in the 'state' branch
  actions: write    # lets a finishing loop job start the next one right away

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 125   # a fast-loop chunk is 100 minutes; single passes take about a minute
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt || (sleep 20 && pip install -r requirements.txt)

      # 1) Primary memory: GitHub cache (what was already sent, last indicator values) plus the last
      #    10 days of intraday snapshots. (Changing this path list starts a new cache version; the
      #    state then comes from the backup branch below, so nothing is lost.)
      - name: Restore state
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            state/state.json
            state/intraday
          key: psx-state-v2-${{ github.run_id }}
          restore-keys: psx-state-v2-

      # 2) Backup memory: the 'state' branch. The newer of the two copies wins (a loop job that was
      #    killed by GitHub has backed up to the branch every 10 minutes, while its cache is older).
      - name: Use the newer copy (cache or backup branch)
        run: |
          mkdir -p state
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:state.json > state/state.branch.json || true
          fi
          python - <<'EOF'
          import json, os
          def saved(p):
              try:
                  return json.load(open(p, encoding="utf-8")).get("_saved", 0)
              except Exception:
                  return -1
          c, b = "state/state.json", "state/state.branch.json"
          sc, sb = saved(c), saved(b)
          if sb > sc:
              os.replace(b, c); print("Using the backup branch copy (newer)")
          elif sc >= 0:
              print("Using the cache copy")
          else:
              print("No saved state yet (first run)")
          if os.path.exists(b):
              os.remove(b)
          EOF

      # Research Lab levels (buy zones, fails-below lines, targets from last night's report) for the private
      # level alerts during the session. Read only: this workflow never saves the Lab's cache.
      - name: Research Lab levels (read only)
        uses: actions/cache/restore@v4
        with:
          path: state/lab
          key: psx-lab-v1-${{ github.run_id }}
          restore-keys: psx-lab-v1-

      # The pipeline runs in the background so that, while the fast loop is open, the state can be
      # copied to the backup branch every 10 minutes.
      - name: Run pipeline
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}   # lets the loop start the swing / Stock of the Day workflows on time
          TZ: Asia/Karachi
        run: |
          python -m pipeline ${{ inputs.command || 'auto' }} &
          pid=$!
          while kill -0 $pid 2>/dev/null; do
            for i in $(seq 60); do sleep 10; kill -0 $pid 2>/dev/null || break 2; done
            bash .github/backup_state.sh "${{ github.repository }}" "${{ github.token }}"
          done
          wait $pid

      - name: Save state
        if: always() && hashFiles('state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            state/state.json
            state/intraday
          key: psx-state-v2-${{ github.run_id }}

      # Finished trading days (gzipped by the pipeline) are kept for good as files of the GitHub
      # release "intraday": public PSX price snapshots, about 0.5 MB a day, one file per day.
      - name: Archive intraday data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(state/intraday/*.csv.gz)
          [ ${#files[@]} -eq 0 ] && { echo "No finished day to archive"; exit 0; }
          if ! gh release view intraday >/dev/null 2>&1; then
            gh release create intraday --title "Intraday price snapshots" --latest=false \
              --notes "One file per trading day: time, symbol, last price, cumulative volume, high, low, recorded about once a minute during the session. Public PSX data collected by the pipeline." \
              || { echo "Could not create the release (will retry next run)"; exit 0; }
          fi
          have=$(gh release view intraday --json assets --jq '.assets[].name' 2>/dev/null || true)
          for f in "${files[@]}"; do
            n=$(basename "$f")
            if printf '%s\n' "$have" | grep -qx "$n"; then continue; fi
            gh release upload intraday "$f" && echo "Archived $n" || echo "Upload of $n failed (will retry next run)"
          done

      # Back up the state to the 'state' branch after every run (one commit, force-pushed: no history growth).
      # This also counts as repository activity, so GitHub never pauses the schedule.
      - name: Back up state
        if: always() && hashFiles('state/state.json') != ''
        run: bash .github/backup_state.sh "${{ github.repository }}" "${{ github.token }}"

      # Every job ends by asking for the next one, so the chain never depends on GitHub's schedule
      # (which starts jobs hours late). No next job when: the pipeline said so (loop switched off in
      # config.yaml), the run was cancelled by hand (that is how to stop the chain), or another run is
      # already waiting its turn. After a failed job it waits 5 minutes first (no rapid retry storm).
      - name: Hand over to the next loop job
        if: always() && !cancelled() && steps.run.outputs.continue != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            echo "This job did not finish cleanly; waiting 5 minutes before asking for the next one"
            sleep 300
          fi
          waiting=0
          for s in queued pending waiting; do
            n=$(gh run list --workflow=pipeline.yml --status=$s --json databaseId --jq length 2>/dev/null || echo 0)
            waiting=$((waiting + ${n:-0}))
          done
          if [ "$waiting" = "0" ]; then
            gh workflow run pipeline.yml -f command=auto && echo "Next loop job requested" \
              || echo "Could not request the next job (the schedule will start it)"
          else
            echo "A run is already waiting; it will continue the loop"
          fi

      # If the whole run failed (e.g. GitHub/PyPI outage), tell the owner privately — at most every 3 hours.
      - name: Notify owner on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]'); ADMIN=$(printf '%s' "$ADMIN" | tr -d '[:space:]')
          h=$(date -u +%H); m=$(date -u +%M)
          if [ -n "$ADMIN" ] && [ $((10#$h % 3)) -eq 0 ] && [ $((10#$m)) -lt 10 ]; then
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="${ADMIN}" \
              --data-urlencode text="PSX pipeline: a run failed. It will keep retrying automatically. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null || true
          fi
