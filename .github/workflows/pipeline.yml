name: PSX News Pipeline

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes, 24/7 (GitHub may delay runs by a few minutes)
  workflow_dispatch:         # "Run workflow" button for manual runs
    inputs:
      command:
        description: "What to do"
        type: choice
        default: run
        options:
          - run
          - test --admin-only
          - test
          - brief morning
          - brief close
          - brief week_ahead
          - about
          - chats

concurrency:
  group: psx-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Restore the latest saved state (what was already sent, last indicator values)
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state/state.json
          key: psx-state-v2-${{ github.run_id }}
          restore-keys: psx-state-v2-

      - name: Run pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TZ: Asia/Karachi
        run: python -m pipeline ${{ inputs.command || 'run' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/state.json
          key: psx-state-v2-${{ github.run_id }}
